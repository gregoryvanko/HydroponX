; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
; Mot de passe OTA et adresse de l'ESP32 (fichier ignoré par git,
; à créer à partir de secrets.ini.example)
extra_configs = secrets.ini

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 9600
build_flags =
    '-DCONFIG_OTA_PASSWORD="${secrets.ota_password}"'
lib_deps =
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.0

; Téléversement par le réseau (OTA) : pio run -e esp32dev_ota -t upload
[env:esp32dev_ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = ${secrets.ota_host}
upload_flags =
    --auth=${secrets.ota_password}
    --port=3232
